baseURL = "https://n8.gay/"
title = "Nate Gay"
theme = "hello-friend"

# `paginate` was removed in Hugo 0.128.
[pagination]
  pagerSize = 5

[params]
  copyright = "Nate Gay"

  [params.author]
    name = "Nate Gay"
    email = "email@n8.gay"

  # dir name of your blog content (default is `content/posts`).
  # the list of set content will show up on your index page (baseurl).
  contentTypeName = "blog"

  # if you set this to 0, only submenu trigger will be visible
  # showMenuItems = 2

  # Show reading time in minutes for posts
  # showReadingTime = true

  # Show table of contents at the top of your posts (defaults to false)
  # Alternatively, add this param to post front matter for specific posts
  # toc = true

  # Show full page content in RSS feed items
  #(default is Description or Summary metadata in the front matter)
  # rssFullText = true

[languages]
  [languages.en]
    title = "Nate Gay"

    # These are read by the theme as .Site.Params.*, so they have to live under
    # [languages.en.params]. Modern Hugo no longer promotes arbitrary keys set
    # directly on [languages.en] into Params — they silently resolve to empty,
    # which is how the meta description ended up blank.
    [languages.en.params]
      subtitle = "Flight software engineer"
      keywords = "flight software, F Prime, FPrime, CubeSat, hardware-in-the-loop, PROVES, Texas State University, small satellites, Kubernetes, Golang"
      menuMore = "Show more"
      writtenBy = "Written by"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      minuteReadingTime = "min read"
      dateFormatSingle = "2006-01-02"
      dateFormatList = "2006-01-02"

    [languages.en.params.logo]
      logoText = "Nate Gay"
      logoHomeLink = "/"
      alt = "Satellite"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
      [[languages.en.menu.main]]
        identifier = "cv"
        name = "CV"
        url = "/cv"
